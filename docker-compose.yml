services:

  backend:
    build: ./Back_Blog
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file:
      - ./Back_Blog/.env

  frontend:
    build:
      context: ./Front_Blog
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/blog/v1}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
